<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SourceWise · live demo recording</title>
<style>
  body { margin: 0; background: #122a24; color: #e7f0e9; font: 16px system-ui; }
  button { font: 600 17px system-ui; padding: 12px 22px; background: #c9ed9a;
    color: #122a24; border: 0; border-radius: 7px; margin: 12px; cursor: pointer; }
  canvas { display: block; max-width: 100vw; max-height: 88vh; margin: auto; }
</style>
<button id="go" onclick="begin()">Record live demo · 2 min 50 sec</button>
<span id="msg">Records the live app canvas with captions. No microphone or desktop capture.</span>
<canvas id="screen" width="1360" height="900"></canvas>
<script>
const canvas = document.getElementById("screen"), ctx = canvas.getContext("2d");
const duration = 170;
let state = {log: "Ready. Run the agent to call Gemini.", brief: ""};
let started = 0, outputReadyAt = 0;
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}
function text(value, x, y, size = 22, color = "#18332c", weight = "normal") {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px system-ui`;
  ctx.fillText(value, x, y);
}
function rows(value, width, size) {
  ctx.font = `${size}px system-ui`;
  const result = [];
  for (const paragraph of value.split("\n")) {
    let row = "";
    for (const word of paragraph.split(/\s+/)) {
      const next = row ? `${row} ${word}` : word;
      if (row && ctx.measureText(next).width > width) {
        result.push(row);
        row = word;
      } else row = next;
    }
    if (row) result.push(row);
  }
  return result;
}
function paragraph(value, x, y, width, size = 25, line = 38) {
  for (const row of rows(value, width, size)) {
    text(row, x, y, size);
    y += line;
  }
  return y;
}
function draw() {
  const elapsed = started ? (Date.now() - started) / 1000 : 0;
  rect(0, 0, 1360, 900, "#f3f2ec");
  rect(0, 0, 1360, 130, "#153e34");
  text("SourceWise", 48, 60, 38, "#fff", "bold");
  text("Short research briefs from supplied documents", 48, 101, 22, "#cce0d2");
  text(started ? `${Math.min(duration, Math.floor(elapsed))}s / ${duration}s` : "LIVE DEMO",
    1110, 64, 20, "#c9ed9a", "bold");
  text("SRVCABLE  ·  23 Sep 2026  ·  8 documents  ·  Python + Gemini 3.8 Flash", 48, 175, 24);
  if (elapsed < 22 || elapsed >= 67) {
    text("1. A real run", 48, 230, 30, "#18332c", "bold");
    rect(48, 258, 590, 445, "#173b31");
    ctx.save();
    ctx.beginPath();
    ctx.rect(68, 278, 550, 340);
    ctx.clip();
    const logRows = rows(state.log || "Starting...", 550, 18).slice(-11);
    logRows.forEach((row, index) => text(row, 68, 302 + index * 28, 18, "#e4f0de"));
    ctx.restore();
    text(state.running ? "RUNNING · actual API calls" : state.brief ? "COMPLETE · checks passed" : "Ready",
      68, 662, 20, "#c9ed9a", "bold");
    text("Generated brief · original wording", 680, 270, 23, "#18332c", "bold");
    const brief = state.brief
      ? state.brief.replace(/\[S\d+\]\([^)]*\)/g, "").split("## Sources")[0]
      : "The brief appears after the quote checks and the model review pass.";
    const briefRows = rows(brief, 630, 19);
    const visible = 17;
    const age = outputReadyAt ? (Date.now() - outputReadyAt) / 1000 : 0;
    const scroll = Math.min(Math.max(0, briefRows.length - visible), Math.floor(Math.max(0, age - 8) / 2));
    ctx.save();
    ctx.beginPath();
    ctx.rect(680, 285, 630, 505);
    ctx.clip();
    briefRows.slice(scroll, scroll + visible).forEach((row, index) => text(row, 680, 313 + index * 28, 19));
    ctx.restore();
    paragraph("Exact quotes → short draft → claim review → source links", 55, 750, 570, 22, 32);
  } else if (elapsed < 47) {
    text("2. Design choice: keep evidence separate", 48, 240, 32, "#18332c", "bold");
    let y = 310;
    for (const line of [
      "First, extract short facts with exact quotes and source IDs.",
      "Then write the brief. A separate call checks every fact and point against the source files.",
      "If a quote fails, ask the model to correct it once. Keep both replies. Never silently repair it."
    ]) y = paragraph(line, 65, y, 1210, 27, 42) + 28;
    rect(48, 635, 1264, 150, "#e2ecd8");
    paragraph("For this pack: prefer the company revenue figure, date the old pledge warning, and exclude the stock-tip instructions and the unrelated cable-TV business.", 70, 679, 1200, 25, 38);
  } else {
    text("3. Limitation: the reviewer can also be wrong", 48, 240, 32, "#18332c", "bold");
    let y = 315;
    for (const line of [
      "A quote can match perfectly and still be misread. Number matching alone is not enough.",
      "The extra model review checks meaning, dates and units. It reduces risk but does not prove accuracy.",
      "This is a fictional document pack. There is no live price feed or valuation model.",
      "The test log records failed runs and prompt changes. Final evidence and source files are in the repo."
    ]) y = paragraph(line, 65, y, 1200, 27, 42) + 25;
  }
  rect(0, 839, 1360, 61, "#153e34");
  text("Real API run · app canvas capture · captions, no voice narration", 48, 878, 22, "#d8ead9");
  requestAnimationFrame(draw);
}
draw();
setInterval(async () => {
  try {
    const next = await (await fetch("/status")).json();
    if (next.brief && !state.brief) outputReadyAt = Date.now();
    state = next;
  } catch (error) { document.getElementById("msg").textContent = "Demo server unavailable."; }
}, 700);
async function begin() {
  document.getElementById("go").disabled = true;
  const response = await fetch("/start", {method: "POST"});
  if (!response.ok) {
    document.getElementById("msg").textContent = `Could not start: ${response.status}`;
    document.getElementById("go").disabled = false;
    return;
  }
  started = Date.now();
  outputReadyAt = 0;
  const chunks = [];
  const type = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
    ? "video/webm;codecs=vp9" : "video/webm";
  const recorder = new MediaRecorder(canvas.captureStream(15), {mimeType: type, videoBitsPerSecond: 1100000});
  recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
  recorder.onstop = async () => {
    const blob = new Blob(chunks, {type: "video/webm"});
    const saved = await fetch("/save-video", {method: "POST", headers: {"Content-Type": "video/webm"}, body: blob});
    document.getElementById("msg").textContent = saved.ok ? "Recording saved: submission/demo.webm" : "Save failed";
  };
  recorder.start(1000);
  document.getElementById("msg").textContent = "Recording the live app for 2 min 50 sec…";
  setTimeout(() => recorder.stop(), duration * 1000);
}
</script>
</html>
