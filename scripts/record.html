<!doctype html><html><meta charset="utf-8"><title>SourceWise · live demo recording</title><style>body{margin:0;background:#122a24;color:#e7f0e9;font:16px system-ui}button{font:600 17px system-ui;padding:12px 22px;background:#c9ed9a;color:#122a24;border:0;border-radius:7px;margin:12px;cursor:pointer}canvas{display:block;max-width:100vw;max-height:88vh;margin:auto;background:#f3f2ec}#msg{font-size:16px}</style><button id="go" onclick="begin()">Record live demo · 2 min 20 sec</button><span id="msg">Records this application's live canvas, with captions. No microphone or desktop capture.</span><canvas id="screen" width="1360" height="900"></canvas><script>
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'); let state={log:'Ready. This is the real Python CLI, not a fixture.',brief:''},t0=0,finished=false;
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function text(s,x,y,size=22,color='#18332c',weight='normal'){ctx.fillStyle=color;ctx.font=weight+' '+size+'px system-ui';ctx.fillText(s,x,y)}
function wrap(s,x,y,width,size=21,line=31,maxLines=99,color='#18332c'){ctx.font=size+'px system-ui';ctx.fillStyle=color;let row='',n=0;for(let word of s.split(/\s+/)){let next=row+word+' ';if(ctx.measureText(next).width>width&&row){ctx.fillText(row,x,y+n*line);row=word+' ';if(++n>=maxLines)return y+n*line;}else row=next;}if(row)ctx.fillText(row,x,y+n++*line);return y+n*line;}
function draw(){let elapsed=t0?(Date.now()-t0)/1000:0;rect(0,0,1360,900,'#f3f2ec');rect(0,0,1360,130,'#153e34');text('SourceWise',48,60,38,'#ffffff','bold');text('Document-grounded research agent · Python + Gemini 3.8 Flash',48,101,21,'#cce0d2');text(t0?Math.floor(elapsed)+'s / 140s':'LIVE APP DEMO',1090,64,20,'#c9ed9a','bold');
text('NSE: SRVCABLE     |     As of 23 Sep 2026     |     8 supplied documents',48,175,24);
if(elapsed<25 || elapsed>=70){text('1. Watch the real agent run',48,230,30,'#18332c','bold');rect(48,258,600,420,'#173b31');let lines=(state.log||'').split('\n');let y=296;for(let line of lines.slice(-12)){y=wrap(line,70,y,555,18,27,3,'#e4f0de')+8;}
text(state.running?'RUNNING · actual API calls':state.brief?'COMPLETE · local validation passed':'Ready',70,646,20,'#c9ed9a','bold');text('Generated brief · exact text',690,270,23,'#18332c','bold');
let out=state.brief||'The output will appear when the model finishes and the local checks pass.';out=out.replace(/\[S\d+\]\([^)]*\)/g,'').split('## Sources')[0];let rows=out.split('\n').filter(Boolean);let skip=elapsed>110?Math.floor((elapsed-110)/4):0;y=310;for(let row of rows.slice(skip)){y=wrap(row,690,y,615,18,27,8)+12;if(y>740)break;}
rect(48,725,600,72,'#e3edd8');wrap('Ticker + documents → assess sources → verify excerpts → write a cited one-page brief.',66,752,565,20,27,2);
}else if(elapsed<50){text('2. Design decision: evidence before prose',48,240,32,'#18332c','bold');let y=300;for(let s of ['First call: classify sources and build facts with source excerpts.','Local checks: exact excerpts, known IDs, supported numbers, date cutoff.','Second call: write from the ledger; Python inserts the source links.']){y=wrap(s,65,y,1200,27,41)+24;}rect(48,535,1264,205,'#e2ecd8');text('What this protects against',70,581,27,'#18332c','bold');wrap('Conflicting revenue: prefer the primary filing. Old pledge warning: retain its historical date. Promotional prompt injection and the cable-TV company: exclude them.',70,630,1190,25,38,3);text('Small quote-copy errors are aligned to a unique source paragraph and logged.',65,794,21);
}else{text('3. Limitation: a matching quote is not proof',48,240,32,'#18332c','bold');let y=310;for(let s of ['A source can be wrong. A model can misinterpret an exact quotation.','The program checks provenance and structure; semantic review still matters.','There is no live price feed or valuation model. Management forecasts stay conditional.','Test log: three real experiments, changed prompts, preserved failures and raw responses.']){y=wrap(s,65,y,1190,27,42)+30;}}
rect(0,839,1360,61,'#153e34');text('Live application-surface capture · real run · captions replace voice narration',48,878,22,'#d8ead9');requestAnimationFrame(draw)}draw();
setInterval(async()=>{try{state=await(await fetch('/status')).json()}catch(e){}},700);
async function begin(){document.getElementById('go').disabled=true;const r=await fetch('/start',{method:'POST'});if(!r.ok){document.getElementById('msg').textContent='Could not start: '+r.status;return;}t0=Date.now();let chunks=[];let type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';let recorder=new MediaRecorder(canvas.captureStream(15),{mimeType:type,videoBitsPerSecond:1100000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{let blob=new Blob(chunks,{type:'video/webm'});let saved=await fetch('/save-video',{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});finished=true;document.getElementById('msg').textContent=saved.ok?'Recording saved: submission/demo.webm':'Save failed';};recorder.start(1000);document.getElementById('msg').textContent='Recording the live app for 2 min 20 sec…';setTimeout(()=>recorder.stop(),140000);}
</script></html>
